name: Deploy Benchmark Viewer

on:
  push:
    branches:
      - main
      - feat/host-benchmarks-on-ga
    paths:
      - 'benchmarkviewer/**'
      - 'results/**'
      - '.github/workflows/deploy-benchmarkviewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build static data
        run: |
          cd retrievalbench/benchmarkviewer
          bun run build-static.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'retrievalbench/benchmarkviewer'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
