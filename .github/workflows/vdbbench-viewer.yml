name: VectorDBBench — Viewer

# On-demand deploy of the VDBBench results UI to Cloud Run, at a stable public
# URL. Peer results come from the fork, ours from the results bucket. Image
# build and GCP setup live in vdbbench-viewer/.

on:
  workflow_dispatch:
    inputs:
      vdbbench_ref:
        description: "VectorDBBench ref to publish."
        required: false
        default: main
        type: string
      region:
        description: "Cloud Run and Artifact Registry region."
        required: false
        default: us-central1
        type: string
      gcp_project:
        description: "GCP project; empty = vars.GCP_PROJECT_ID."
        required: false
        default: ""
        type: string
      runtime_service_account:
        description: "Identity the public container runs as; empty = vars.VDBBENCH_VIEWER_RUNTIME_SA."
        required: false
        default: ""
        type: string

  # Same inputs as above; Actions has no way to share one block. Keep in sync.
  workflow_call:
    inputs:
      vdbbench_ref:
        description: "VectorDBBench ref to publish."
        required: false
        default: main
        type: string
      region:
        description: "Cloud Run and Artifact Registry region."
        required: false
        default: us-central1
        type: string
      gcp_project:
        description: "GCP project; empty = vars.GCP_PROJECT_ID."
        required: false
        default: ""
        type: string
      runtime_service_account:
        description: "Identity the public container runs as; empty = vars.VDBBENCH_VIEWER_RUNTIME_SA."
        required: false
        default: ""
        type: string

permissions:
  id-token: write   # OIDC federated login
  contents: read

# A deploy is short but must not be interrupted half-rolled-out.
concurrency:
  group: vdbbench-viewer
  cancel-in-progress: false

env:
  SERVICE: vdbbench-viewer
  AR_REPO: vdbbench-viewer

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ci
    timeout-minutes: 30
    steps:
      - name: Checkout (this repo, for the image build and composite actions)
        uses: actions/checkout@v4

      # Public repo, so no token is needed to reach it.
      - name: Checkout VectorDBBench
        uses: actions/checkout@v4
        with:
          repository: infino-ai/VectorDBBench
          ref: ${{ inputs.vdbbench_ref }}
          path: vdbbench-viewer/src
          fetch-depth: 1

      - name: Resolve deploy settings
        env:
          INPUT_PROJECT: ${{ inputs.gcp_project }}
          INPUT_RUNTIME_SA: ${{ inputs.runtime_service_account }}
          INPUT_REGION: ${{ inputs.region }}
          VAR_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          VAR_DEPLOY_SA: ${{ vars.VDBBENCH_VIEWER_DEPLOY_SA }}
          VAR_RUNTIME_SA: ${{ vars.VDBBENCH_VIEWER_RUNTIME_SA }}
          VAR_BUCKET: ${{ vars.VDBBENCH_RESULTS_BUCKET }}
        run: |
          set -euo pipefail
          PROJECT="${INPUT_PROJECT:-}"; PROJECT="${PROJECT:-$VAR_PROJECT}"
          RUNTIME_SA="${INPUT_RUNTIME_SA:-}"; RUNTIME_SA="${RUNTIME_SA:-$VAR_RUNTIME_SA}"

          for pair in "GCP_PROJECT_ID=$PROJECT" \
                      "VDBBENCH_VIEWER_DEPLOY_SA=$VAR_DEPLOY_SA" \
                      "VDBBENCH_VIEWER_RUNTIME_SA=$RUNTIME_SA" \
                      "VDBBENCH_RESULTS_BUCKET=$VAR_BUCKET"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::${pair%%=*} is unset on the ci environment. See vdbbench-viewer/README.md."
              exit 1
            fi
          done

          # Results change without the fork moving, so the fork SHA alone would
          # let one tag mean two different images.
          TAG="$(git -C vdbbench-viewer/src rev-parse --short HEAD)-${GITHUB_RUN_ID}"
          {
            echo "PROJECT=$PROJECT"
            echo "RUNTIME_SA=$RUNTIME_SA"
            echo "REGION=$INPUT_REGION"
            echo "TAG=$TAG"
            echo "IMAGE=${INPUT_REGION}-docker.pkg.dev/${PROJECT}/${AR_REPO}/viewer"
            echo "BUCKET=$VAR_BUCKET"
          } >> "$GITHUB_ENV"

      - name: GCP login
        uses: ./.github/actions/cloud-login
        with:
          cloud: gcp
          gcp_wif_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          gcp_service_account: ${{ vars.VDBBENCH_VIEWER_DEPLOY_SA }}

      # The deploy account may only push here; the registry and its cleanup
      # policy are set up once, out of band.
      - name: Check Artifact Registry
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe "$AR_REPO" \
            --location="$REGION" --project="$PROJECT" >/dev/null 2>&1 || {
              echo "::error::Artifact Registry '$AR_REPO' missing in $REGION. See vdbbench-viewer/README.md."
              exit 1
            }

      # The Dockerfile copies whatever lands here over upstream's results.
      - name: Sync published results
        run: |
          set -euo pipefail
          mkdir -p vdbbench-viewer/results
          gcloud storage rsync --recursive "$BUCKET" vdbbench-viewer/results \
            --project="$PROJECT" --delete-unmatched-destination-objects
          echo "synced $(find vdbbench-viewer/results -name '*.json' | wc -l) result file(s)"

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" vdbbench-viewer

      # strip_run_mode.py already failed the build if it could not remove these,
      # so this only catches a Dockerfile that stopped invoking it.
      - name: Assert the image has no run-mode UI
        run: |
          docker run --rm -i --entrypoint python "$IMAGE:$TAG" - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path("/app/vectordb_bench/frontend")
          present = [p for p in ("pages/run_test.py", "pages/custom.py", "components/run_test")
                     if (root / p).exists()]
          if present:
              sys.exit(f"run-mode UI present in image: {', '.join(present)}")
          print("image carries no run-mode UI")
          PY

      # Catches an undeclared import or a strip that broke a live reference —
      # both look fine until someone opens the page.
      - name: Assert every page renders
        run: |
          docker run --rm -i --entrypoint python "$IMAGE:$TAG" - <<'PY'
          import pathlib
          import sys

          from streamlit.testing.v1 import AppTest

          root = pathlib.Path("/app/vectordb_bench/frontend")
          scripts = [root / "vdbbench.py", *sorted((root / "pages").glob("*.py"))]
          failed = []
          for script in scripts:
              app = AppTest.from_file(str(script), default_timeout=180).run()
              if app.exception:
                  failed.append(f"{script.name}: {[e.message for e in app.exception]}")

          if failed:
              sys.exit("pages raised on render:\n" + "\n".join(failed))
          print(f"{len(scripts)} pages render clean")
          PY

      # Ground truth: what does the RUNNING image's collector actually load?
      # Prints every standard_2026*/Infino group so we can see if the infino
      # standard_20260403 series survives collect() inside the deployed image.
      - name: Probe loaded results
        run: |
          docker run --rm -i --entrypoint python "$IMAGE:$TAG" - <<'PY'
          import pathlib
          from vectordb_bench import config
          from vectordb_bench.backend.result_collector import ResultCollector

          rs = ResultCollector.collect(pathlib.Path(config.RESULTS_LOCAL_DIR))
          print(f"RESULTS_LOCAL_DIR={config.RESULTS_LOCAL_DIR}  total_TestResults={len(rs)}")
          for tr in rs:
              dbs = sorted({r.task_config.db_name for r in tr.results})
              if tr.task_label.startswith("standard_2026") or any("Infino" in d for d in dbs):
                  print(f"  label={tr.task_label:<26} run_id={str(tr.run_id)[:34]:<34} n={len(tr.results)} dbs={dbs}")
          std = [tr for tr in rs if tr.task_label == "standard_20260403"]
          has = any("Infino" in d for tr in std for r in tr.results for d in [r.task_config.db_name])
          print(f">>> Infino under standard_20260403: {has}")
          PY

      - name: Push image
        run: |
          set -euo pipefail
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE:$TAG" \
            --region="$REGION" \
            --project="$PROJECT" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --port=8501 \
            --cpu=1 \
            --memory=2Gi \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=20 \
            --session-affinity \
            --timeout=900 \
            --quiet

          URL="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          echo "URL=$URL" >> "$GITHUB_ENV"

      # First request pays the cold start, so retry rather than race it.
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors \
            --max-time 60 "$URL/_stcore/health"
          echo

      - name: Summary
        if: ${{ always() && env.URL != '' }}
        run: |
          {
            echo "## VDBBench viewer"
            echo
            echo "**$URL**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| VectorDBBench ref | \`${{ inputs.vdbbench_ref }}\` (\`$TAG\`) |"
            echo "| Region | \`$REGION\` |"
            echo "| Image | \`$IMAGE:$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
