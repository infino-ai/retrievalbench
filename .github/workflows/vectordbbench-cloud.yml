name: VectorDBBench (Cloud)

# Both benches in one dispatch, at their default params: two VMs in parallel,
# one shared wheel. Only the knobs that apply to both are exposed — to vary
# n_cent, nprobe, or the dataset, dispatch vdbbench-vector.yml / vdbbench-fts.yml.
# The pipeline itself lives in _vdbbench-pipeline.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which benchmark(s) to run (both = parallel VMs)."
        required: false
        default: both
        type: choice
        options: [vector, fts, both]
      cloud:
        description: "Cloud to provision on."
        required: false
        default: azure
        type: choice
        options: [azure, aws, gcp]
      binding_source:
        description: "infino binding: build from a branch, or use the published PyPI wheel."
        required: false
        default: branch
        type: choice
        options: [branch, published]
      infino_ref:
        description: "infino branch to build (binding_source=branch)."
        required: false
        default: main
        type: string
      vdbbench_ref:
        description: "VectorDBBench harness ref."
        required: false
        default: main
        type: string
      infino_env:
        description: "Engine tuning: space-separated INFINO_...=value pairs, applied to both benches."
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: "Hard auto-stop per bench (min); VM torn down when hit."
        required: false
        default: "180"
        type: string

      publish_results:
        description: "Upload these numbers and redeploy the viewer."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # OIDC federated login; a called workflow cannot exceed this
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_vdbbench-pipeline.yml
    secrets: inherit
    with:
      mode: ${{ inputs.mode }}
      cloud: ${{ inputs.cloud }}
      binding_source: ${{ inputs.binding_source }}
      infino_ref: ${{ inputs.infino_ref }}
      vdbbench_ref: ${{ inputs.vdbbench_ref }}
      infino_env: ${{ inputs.infino_env }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      publish_results: ${{ inputs.publish_results }}
