name: VectorDBBench — Vector

# Vector ANN bench (Cohere, cosine) on one ephemeral VM. Machinery lives in
# vdbbench-run.yml; this file is the dispatch form.
#
# Recall is the number to read first: QPS unqualified by recall compares to
# nothing. Recall is still being tuned — n_cent is the dominant lever and it
# runs inverse (finer clusters, worse recall), because the engine probes a flat
# INFINO_VECTOR__FINE_NPROBE_FLOOR (4) of them per cell.

on:
  workflow_dispatch:
    inputs:
      vector_case:
        description: "Vector CaseType."
        required: false
        default: Performance768D1M
        type: string
      vector_k:
        description: "Top-k. 100 is the VDBBench standard and its ceiling — the ground truth holds 100 neighbors."
        required: false
        default: "100"
        type: string
      n_cent:
        description: "Fine IVF clusters per (superfile, cell) fragment, not a whole-corpus count. Size to sqrt(corpus / user_cell_count); 64 suits 1M over the engine's 256 cells."
        required: false
        default: "64"
        type: string
      nprobe:
        description: "Coarse grid cells probed per query, of user_cell_count (default 256). 64 ~= LanceDB's default probe fraction; measured runs show little effect on recall or cost."
        required: false
        default: "64"
        type: string
      rerank_mult:
        description: "Coarse candidates re-scored exactly = k * rerank_mult. The 256 default sits above what routing supplies, so it only becomes a QPS lever once recall is on target."
        required: false
        default: "256"
        type: string
      num_concurrency:
        description: "Concurrency levels for the QPS sweep (comma-separated); max QPS is the best level. 16 = vCPUs on the default VMs; past ~32 the load OOMs 64 GiB."
        required: false
        default: "1,5,10,16"
        type: string
      num_per_batch:
        description: "Rows per insert batch. Large avoids manifest-part write amplification; upstream uses 100, so load timings are not comparable."
        required: false
        default: "50000"
        type: string
      infino_env:
        description: "Engine tuning: space-separated INFINO_...=value pairs. The untried recall lever is INFINO_VECTOR__FINE_NPROBE_PCT=0.25 (scales fine-probe depth with cell size instead of the flat floor of 4)."
        required: false
        default: ""
        type: string
      cache_budget_bytes:
        description: "Infino disk-cache ceiling, per connection. Below the client's 64 GiB default because every concurrency worker opens its own."
        required: false
        default: "21474836480"
        type: string
      cloud:
        description: "Cloud to provision on."
        required: false
        default: azure
        type: choice
        options: [azure, aws, gcp]
      vm_size:
        description: "Instance type (cloud-specific; empty = per-cloud default)."
        required: false
        default: ""
        type: string
      location:
        description: "Region (Azure/AWS) or zone (GCP); empty = per-cloud default."
        required: false
        default: ""
        type: string
      binding_source:
        description: "infino binding: build from a branch, or use the published PyPI wheel."
        required: false
        default: branch
        type: choice
        options: [branch, published]
      infino_ref:
        description: "infino branch to build (binding_source=branch); measures that branch, not the published wheel."
        required: false
        default: main
        type: string
      vdbbench_ref:
        description: "VectorDBBench harness ref."
        required: false
        default: main
        type: string
      timeout_minutes:
        description: "Hard auto-stop (min); VM torn down when hit."
        required: false
        default: "180"
        type: string

jobs:
  vector:
    uses: ./.github/workflows/vdbbench-run.yml
    secrets: inherit
    with:
      bench: vector
      vector_case: ${{ inputs.vector_case }}
      vector_k: ${{ inputs.vector_k }}
      n_cent: ${{ inputs.n_cent }}
      nprobe: ${{ inputs.nprobe }}
      rerank_mult: ${{ inputs.rerank_mult }}
      num_concurrency: ${{ inputs.num_concurrency }}
      num_per_batch: ${{ inputs.num_per_batch }}
      infino_env: ${{ inputs.infino_env }}
      cache_budget_bytes: ${{ inputs.cache_budget_bytes }}
      cloud: ${{ inputs.cloud }}
      vm_size: ${{ inputs.vm_size }}
      location: ${{ inputs.location }}
      binding_source: ${{ inputs.binding_source }}
      infino_ref: ${{ inputs.infino_ref }}
      vdbbench_ref: ${{ inputs.vdbbench_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
