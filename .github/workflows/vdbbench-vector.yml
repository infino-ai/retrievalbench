name: VectorDBBench — Vector

# Vector ANN bench (Cohere, cosine) on one ephemeral VM. Machinery lives in
# vdbbench-run.yml; this file is the dispatch form.

on:
  workflow_dispatch:
    inputs:
      vector_case:
        description: "Vector CaseType."
        required: false
        default: Performance768D1M
        type: string
      vector_k:
        description: "Top-k for vector search."
        required: false
        default: "100"
        type: string
      n_cent:
        description: "IVF centroid count for the index spec (empty = client default)."
        required: false
        default: ""
        type: string
      nprobe:
        description: "Cells probed per query (empty = engine's calibrated default)."
        required: false
        default: ""
        type: string
      rerank_mult:
        description: "Exact-rerank multiplier (empty = engine default)."
        required: false
        default: ""
        type: string
      num_concurrency:
        description: "Concurrency levels for the QPS sweep (comma-separated)."
        required: false
        default: "1,8,16"
        type: string
      num_per_batch:
        description: "Rows per insert batch (VDBBench NUM_PER_BATCH)."
        required: false
        default: "1000"
        type: string
      infino_env:
        description: "Engine tuning: space-separated INFINO_...=value pairs."
        required: false
        default: ""
        type: string
      cache_budget_bytes:
        description: "Infino disk-cache ceiling in bytes, per connection."
        required: false
        default: "21474836480"
        type: string
      cloud:
        description: "Cloud to provision on."
        required: false
        default: azure
        type: choice
        options: [azure, aws, gcp]
      vm_size:
        description: "Instance type (cloud-specific; empty = per-cloud default)."
        required: false
        default: ""
        type: string
      location:
        description: "Region (Azure/AWS) or zone (GCP); empty = per-cloud default."
        required: false
        default: ""
        type: string
      binding_source:
        description: "infino binding: build from a branch, or use the published PyPI wheel."
        required: false
        default: branch
        type: choice
        options: [branch, published]
      infino_ref:
        description: "infino branch to build (binding_source=branch)."
        required: false
        default: main
        type: string
      vdbbench_ref:
        description: "VectorDBBench harness ref."
        required: false
        default: main
        type: string
      timeout_minutes:
        description: "Hard auto-stop (min); VM torn down when hit."
        required: false
        default: "180"
        type: string

permissions:
  id-token: write   # OIDC federated login; a called workflow cannot exceed this
  contents: read

jobs:
  vector:
    uses: ./.github/workflows/vdbbench-run.yml
    secrets: inherit
    with:
      bench: vector
      vector_case: ${{ inputs.vector_case }}
      vector_k: ${{ inputs.vector_k }}
      n_cent: ${{ inputs.n_cent }}
      nprobe: ${{ inputs.nprobe }}
      rerank_mult: ${{ inputs.rerank_mult }}
      num_concurrency: ${{ inputs.num_concurrency }}
      num_per_batch: ${{ inputs.num_per_batch }}
      infino_env: ${{ inputs.infino_env }}
      cache_budget_bytes: ${{ inputs.cache_budget_bytes }}
      cloud: ${{ inputs.cloud }}
      vm_size: ${{ inputs.vm_size }}
      location: ${{ inputs.location }}
      binding_source: ${{ inputs.binding_source }}
      infino_ref: ${{ inputs.infino_ref }}
      vdbbench_ref: ${{ inputs.vdbbench_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
