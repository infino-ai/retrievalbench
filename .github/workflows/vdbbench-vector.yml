name: VectorDBBench — Vector

# Vector ANN bench (Cohere, cosine) on one ephemeral VM. Machinery lives in
# vdbbench-run.yml; this file is the dispatch form.
#
# Recall/QPS curve — one bench run per hnsw_ivf serve-time beam, all under one
# task label so the viewer plots a single curve. From the GitHub UI:
#   Actions -> "VectorDBBench — Vector" -> Run workflow -> in "Use workflow
#   from" pick the branch that carries this file (the ef_sweep field only shows
#   on a branch that has it), then set:
#     ef_sweep        = 128 192 256 384 512 768 1024 1536 2048
#     infino_ref      = main            # engine build; needs vector.hnsw_ef_search
#     vdbbench_ref    = infino-backend  # client with --ef
#     search_mode     = hnsw_ivf        # or leave empty (client default)
#     publish_results = true            # update the results viewer
# Equivalent gh invocation (--ref selects the branch whose workflow file runs):
#   gh workflow run vdbbench-vector.yml --repo infino-ai/retrievalbench \
#     --ref <branch-with-this-file> \
#     -f ef_sweep="128 192 256 384 512 768 1024 1536 2048" \
#     -f infino_ref=main -f vdbbench_ref=infino-backend \
#     -f search_mode=hnsw_ivf -f publish_results=true
# Omit ef_sweep for a single run at the graph's stamped k->ef curve.

on:
  workflow_dispatch:
    inputs:
      vector_case:
        description: "Vector CaseType."
        required: false
        default: Performance768D1M
        type: string
      vector_k:
        description: "Top-k for vector search."
        required: false
        default: "100"
        type: string
      n_cent:
        description: "IVF centroid count for the index spec (empty = client default)."
        required: false
        default: ""
        type: string
      nprobe:
        description: "Cells probed per query (empty = engine's calibrated default)."
        required: false
        default: ""
        type: string
      rerank_mult:
        description: "Exact-rerank multiplier (empty = engine default)."
        required: false
        default: ""
        type: string
      search_mode:
        description: "Vector serving path (ivf | hnsw_ivf). Empty = client default (hnsw_ivf)."
        required: false
        default: ""
        type: string
      ef_sweep:
        description: "Space-separated hnsw_ivf serve-time beams (e.g. '128 192 256 384 512 768 1024 1536 2048'). One bench run per value under a shared task label → the viewer plots them as one recall/QPS curve. Empty = a single run at the stamped k->ef curve."
        required: false
        default: "112 128 192 256 384 512 768 1024 2048"
        type: string
      num_concurrency:
        description: "Concurrency levels for the QPS sweep (comma-separated)."
        required: false
        default: "1,8,16"
        type: string
      num_per_batch:
        description: "Rows per insert batch (VDBBench NUM_PER_BATCH)."
        required: false
        default: "1000"
        type: string
      infino_env:
        description: "Engine tuning: space-separated INFINO_...=value pairs."
        required: false
        default: ""
        type: string
      cache_budget_bytes:
        description: "Infino disk-cache ceiling in bytes, per connection."
        required: false
        default: "21474836480"
        type: string
      cloud:
        description: "Cloud to provision on."
        required: false
        default: azure
        type: choice
        options: [azure, aws, gcp]
      vm_size:
        description: "Instance type (cloud-specific; empty = per-cloud default)."
        required: false
        default: ""
        type: string
      disk_size_gb:
        description: "VM os/boot disk size in GB (512 fits Cohere-10M; raise for 100M/1B)."
        required: false
        default: "512"
        type: string
      location:
        description: "Region (Azure/AWS) or zone (GCP); empty = per-cloud default."
        required: false
        default: ""
        type: string
      binding_source:
        description: "infino binding: build from a branch, or use the published PyPI wheel."
        required: false
        default: branch
        type: choice
        options: [branch, published]
      infino_ref:
        description: "infino branch to build (binding_source=branch)."
        required: false
        default: main
        type: string
      infino_repo:
        description: "Repo to build the infino wheel from (e.g. a contributor fork)."
        required: false
        default: infino-ai/infino
        type: string
      serve:
        description: "Set to 1 to drive search over the client's local loopback bench server (INFINO_BENCH_SERVE) instead of the embedded engine."
        required: false
        default: ""
        type: string
      db_label:
        description: "Series label (db_name suffix, e.g. 16c64g-sq8walk); empty = the VM size."
        required: false
        default: ""
        type: string
      vdbbench_ref:
        description: "VectorDBBench harness ref."
        required: false
        default: main
        type: string
      timeout_minutes:
        description: "Hard auto-stop (min); VM torn down when hit."
        required: false
        default: "180"
        type: string

      publish_results:
        description: "Upload these numbers and redeploy the viewer."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # OIDC federated login; a called workflow cannot exceed this
  contents: read

jobs:
  vector:
    uses: ./.github/workflows/vdbbench-run.yml
    secrets: inherit
    with:
      bench: vector
      vector_case: ${{ inputs.vector_case }}
      vector_k: ${{ inputs.vector_k }}
      n_cent: ${{ inputs.n_cent }}
      nprobe: ${{ inputs.nprobe }}
      rerank_mult: ${{ inputs.rerank_mult }}
      search_mode: ${{ inputs.search_mode }}
      ef_sweep: ${{ inputs.ef_sweep }}
      num_concurrency: ${{ inputs.num_concurrency }}
      num_per_batch: ${{ inputs.num_per_batch }}
      infino_env: ${{ inputs.infino_env }}
      cache_budget_bytes: ${{ inputs.cache_budget_bytes }}
      cloud: ${{ inputs.cloud }}
      vm_size: ${{ inputs.vm_size }}
      disk_size_gb: ${{ inputs.disk_size_gb }}
      location: ${{ inputs.location }}
      binding_source: ${{ inputs.binding_source }}
      infino_ref: ${{ inputs.infino_ref }}
      infino_repo: ${{ inputs.infino_repo }}
      serve: ${{ inputs.serve }}
      db_label: ${{ inputs.db_label }}
      vdbbench_ref: ${{ inputs.vdbbench_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}

  # All requested legs must pass; a skipped leg is not a failure.
  publish:
    needs: [vector]
    if: ${{ inputs.publish_results && !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    uses: ./.github/workflows/vdbbench-publish.yml
    secrets: inherit

  # Numbers are baked into the image, so uploading alone changes nothing.
  deploy-viewer:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: ./.github/workflows/vdbbench-viewer.yml
    secrets: inherit
    with:
      vdbbench_ref: ${{ inputs.vdbbench_ref }}
