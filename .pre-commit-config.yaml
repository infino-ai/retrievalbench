# Optional local hooks: `pip install pre-commit && pre-commit install`.
#
# Formatting and file hygiene only. `cargo check` and `clippy` are not hooks
# here: this crate compiles the engine, DataFusion, and Arrow, and optionally
# FAISS, so a per-commit build would cost minutes. Run them yourself before
# opening a pull request.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: mixed-line-ending
      # Published results are written by scripts/publish_inprocess.py and by
      # the ClickBench runs, and the license texts are reproduced verbatim from
      # upstream. Both need to keep their exact bytes.
      - id: end-of-file-fixer
        exclude: '^(results/|clickbench/results/|LICENSE)'
      - id: trailing-whitespace
        exclude: '^(results/|clickbench/results/|LICENSE)'
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        description: Check formatting, including import layout (std/external/crate grouping + per-crate merge).
        entry: cargo fmt --all -- --check --config imports_granularity=Crate,group_imports=StdExternalCrate --color always
        language: system
        pass_filenames: false
