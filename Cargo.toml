[package]
name = "retrievalbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Head-to-head comparison harness. Reuses the engine-generic bench
# framework that ships in `infino-bench-utils` (infino `main`): the
# `FtsEngine`/`VectorEngine`/`SqlEngine` traits, the `run_*` drivers, the
# shared corpus, RSS sampling, and run-to-run delta reporting. This crate
# only adds peer-engine adapters and per-modality runners.

[dependencies]
# The engine under measurement, pinned to a REV rather than a branch or a
# local path: the codec arms in this harness are only attributable if the
# engine they ran against is identifiable, and a path dep resolves to whatever
# happens to be in a sibling checkout. `e525e465` is `vector/sq4-plane` with
# main merged — it carries the 4-bit walk plane, the AVX-512 nibble kernels,
# and `test_helpers::sq4_flat` (the measurement seam `sq4flat.rs` drives), none
# of which exist on infino `main` yet.
#
# Pinned at `infino-ai/infino` (canonical repo), not a personal fork — the
# commit is fetchable by SHA as a real branch (`vector/sq4-plane-cell-families`)
# even pre-merge, so no fork is needed. `23bb9cca` is `e525e465` (the 4-bit
# walk plane + AVX-512 nibble kernels + test_helpers::sq4_flat) plus two
# follow-up fixes: benches/utils no longer pins ndarray independently of
# hdf5-metno (was splitting the build graph into two incompatible ndarray
# versions once lancedb's lance-index also touched ndarray, surfaced when
# this crate first tried building against lancedb 0.37.1), and
# insert/remove/save-load added to VectorEngine with an
# InfinoVectorEngine reference implementation. Repoint at a `main` SHA once
# that work merges.
infino-bench-utils = { git = "https://github.com/infino-ai/infino.git", rev = "d75d14a73c7e5111385af225fd49f7aced0884b5" }
infino = { git = "https://github.com/infino-ai/infino.git", rev = "d75d14a73c7e5111385af225fd49f7aced0884b5", features = ["test-helpers"] }
tantivy = "0.26.1"
# Async — driven through a
# small tokio runtime inside the adapter. Brings its own arrow; the
# harness only bridges plain corpus types across the boundary.
lancedb = { version = "0.37.1", features = ["aws", "azure"] }
# TurboQuant compressed flat index — pinned to the 1.0.0 release SHA so
# measured numbers are attributable to exact code.
turbovec = { git = "https://github.com/RyanCodrai/turbovec.git", rev = "ccab9f325e6ce2a270a87daf01ae4e443bcf2d49" }
# FAISS PQ / PQFastScan peer. `scripts/build_faiss.sh` builds the exact
# C++ source bundled by faiss-sys 0.7.0 into `target/faiss`; the runner
# adds that directory to the compile/runtime library path.
faiss = { version = "0.13.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Arrow at the exact version lancedb 0.37 resolves to (== infino's 58.3.0),
# used to build the RecordBatches handed to LanceDB. futures drives the
# async result stream; tempfile backs the local (in-memory tier) dataset.
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
futures = "0.3"
tempfile = "3"
# DataFusion at the exact version lancedb 0.37 resolves to (54, built
# against arrow 58). The SQL adapter answers the cross-engine battery by
# registering the Lance dataset as a DataFusion `TableProvider`
# (`lancedb::table::datafusion::BaseTableAdapter`) and running `ctx.sql`,
# so LanceDB is measured through a real Lance scan — the apples-to-apples
# peer for Infino's supertable + DataFusion path.
datafusion = "54.0"

[features]
# Kept explicit so ordinary non-vector comparison builds avoid compiling
# the large C++ dependency. Track A always enables it.
faiss = ["dep:faiss"]

# The peer-engine adapters. A library crate so their unit tests run under
# `cargo test`. Each adapter implements an `infino-bench-utils` engine
# trait; nothing here re-measures or re-renders — that all comes from
# infino.
[lib]
name = "retrievalbench"
path = "benches/comparison/engines/mod.rs"

[[bench]]
name = "bench"
path = "benches/comparison/main.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
