[package]
name = "retrievalbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Head-to-head comparison harness. Reuses the engine-generic bench
# framework that ships in `infino-bench-utils` (infino `main`): the
# `FtsEngine`/`VectorEngine`/`SqlEngine` traits, the `run_*` drivers, the
# shared corpus, RSS sampling, and run-to-run delta reporting. This crate
# only adds peer-engine adapters and per-modality runners. See
# `claude-plans/todo/020_comparison_harness.md`.

[dependencies]
# infino `main` (sql-opt merged) — the framework + Infino reference engines.
infino-bench-utils = { path = "../infino/benches/utils" }
tantivy = "0.26"
# LanceDB peer (vector + FTS + SQL, S3-capable). Async — driven through a
# small tokio runtime inside the adapter. Brings its own arrow; the
# harness only bridges plain corpus types across the boundary.
lancedb = { version = "0.30.0", features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Arrow at the exact version lancedb 0.30 resolves to (== infino's 58.3.0),
# used to build the RecordBatches handed to LanceDB. futures drives the
# async result stream; tempfile backs the local (in-memory tier) dataset.
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
tempfile = "3"
# DataFusion at the exact version lancedb 0.30 resolves to (53.1, built
# against arrow 58). The SQL adapter answers the cross-engine battery by
# registering the Lance dataset as a DataFusion `TableProvider`
# (`lancedb::table::datafusion::BaseTableAdapter`) and running `ctx.sql`,
# so LanceDB is measured through a real Lance scan — the apples-to-apples
# peer for Infino's supertable + DataFusion path.
datafusion = "53.1"

# The peer-engine adapters. A library crate so their unit tests run under
# `cargo test`. Each adapter implements an `infino-bench-utils` engine
# trait; nothing here re-measures or re-renders — that all comes from
# infino.
[lib]
name = "retrievalbench"
path = "benches/comparison/engines/mod.rs"

[[bench]]
name = "comparison-fts"
path = "benches/comparison/fts.rs"
harness = false

[[bench]]
name = "comparison-vector"
path = "benches/comparison/vector.rs"
harness = false

[[bench]]
name = "comparison-sql"
path = "benches/comparison/sql.rs"
harness = false

[[bench]]
name = "comparison-supertable"
path = "benches/comparison/supertable.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
