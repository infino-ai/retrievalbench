[package]
name = "retrievalbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Head-to-head comparison harness. Reuses the engine-generic bench
# framework that ships in `infino-bench-utils` (infino `main`): the
# `FtsEngine`/`VectorEngine`/`SqlEngine` traits, the `run_*` drivers, the
# shared corpus, RSS sampling, and run-to-run delta reporting. This crate
# only adds peer-engine adapters and per-modality runners.

[dependencies]
# The engine under measurement, pinned to a REV rather than a branch or a
# local path: published rows are only attributable if the engine they ran
# against is identifiable. `6eadf7e8` is infino `main`: the shipped
# `flat_ivf` / `hnsw_ivf` modes, the shared per-k recall/latency sweep, the
# `VectorEngine` insert/remove/save-load surface the lifecycle cells drive,
# and the local-table-through-`optimize()` builder + resident-blob
# accounting this harness's infino arm drives. Each committed run's
# `run.json` records the exact engine SHA it measured.
infino-bench-utils = { git = "https://github.com/infino-ai/infino.git", rev = "6eadf7e8c89e90a486ac852f424610717dff1611" }
infino = { git = "https://github.com/infino-ai/infino.git", rev = "6eadf7e8c89e90a486ac852f424610717dff1611", features = ["test-helpers"] }
tantivy = "0.26.1"
# TurboQuant compressed flat index — pinned to the 1.0.0 release SHA so
# measured numbers are attributable to exact code.
turbovec = { git = "https://github.com/RyanCodrai/turbovec.git", rev = "ccab9f325e6ce2a270a87daf01ae4e443bcf2d49" }
# FAISS PQ / PQFastScan peer. `scripts/build_faiss.sh` builds the exact
# C++ source bundled by faiss-sys 0.7.0 into `target/faiss`; the runner
# adds that directory to the compile/runtime library path.
faiss = { version = "0.13.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Engine diagnostics (drain declines, fallback warnings) are tracing
# events; without a subscriber they are silently dropped, and a run that
# quietly fell back to a different serving mode is exactly what this
# harness must never publish. RUST_LOG=infino=warn surfaces them.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Arrow at infino's version (58.3.0), used to build RecordBatches for
# ingest and to read real-corpus parquet. futures drives async result
# streams; tempfile backs local-tier scratch datasets.
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
futures = "0.3"
tempfile = "3"
# DataFusion at the version built against arrow 58: infino's public
# `update`/`delete` take DataFusion `Expr` predicates, so the write cells
# need it to drive the public API.
datafusion = "54.0"

[features]
# Kept explicit so ordinary non-vector comparison builds avoid compiling
# the large C++ dependency. Track A always enables it.
faiss = ["dep:faiss"]

# The peer-engine adapters. A library crate so their unit tests run under
# `cargo test`. Each adapter implements an `infino-bench-utils` engine
# trait; nothing here re-measures or re-renders — that all comes from
# infino.
[lib]
name = "retrievalbench"
path = "benches/comparison/engines/mod.rs"

[[bench]]
name = "bench"
path = "benches/comparison/main.rs"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

