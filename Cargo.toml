[package]
name = "retrievalbench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Head-to-head comparison benches and cross-engine oracle tests for infino vs Tantivy and LanceDB"

[lib]
path = "benches/utils/mod.rs"

[dependencies]
# The crate under test. Path dep on the sibling `infino` repo
# (cloned alongside this one by the workspace bootstrap script).
# `test-helpers` exposes `infino::test_helpers::*` for fixture builders.
infino = { path = "../infino", features = ["test-helpers"] }

# Reference engines.
tantivy = "0.26"
# Pinned: lancedb 0.x is unstable. Bumping requires re-checking the
# bench harness API surface. lancedb 0.27 builds against arrow 57;
# infino tracks arrow 58, so the bench imports arrow 57 under a
# renamed alias to construct batches lancedb can consume.
lancedb = { version = "=0.27.2", default-features = false }
arrow-array-lance = { package = "arrow-array", version = "=57.3.0" }
arrow-schema-lance = { package = "arrow-schema", version = "=57.3.0" }

# Shared with infino — pinned versions match infino's deps so the
# RecordBatches we construct here are interchangeable with infino's.
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
bytes = "1"
rand = "0.10"
rand_distr = "0.6"
rayon = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

# Bench-only utilities.
criterion = "0.8"
hdrhistogram = "7"
fastbloom = "0.17"
memmap2 = "0.9"
num_cpus = "1"
zstd = "0.13"

[[bench]]
name = "fts"
path = "benches/fts/main.rs"
harness = false

[[bench]]
name = "vector"
path = "benches/vector/main.rs"
harness = false

[[bench]]
name = "hybrid"
path = "benches/hybrid/main.rs"
harness = false

[[bench]]
name = "scale"
path = "benches/scale/main.rs"
harness = false

[[bench]]
name = "data_structures"
path = "benches/data-structures/main.rs"
harness = false

[profile.release]
# Inherits infino's release profile via the path dep; bench builds
# pick up infino's `lto = "thin"` automatically.
